[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[project]
name = "batekbot"
version = "0.1.0"
description = "Discord bot with music, video, and utility features"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohappyeyeballs>=2.4.0",
    "aiohttp>=3.10.0",
    "aiosignal>=1.3.0",
    "attrs>=24.0.0",
    "bcrypt>=4.2.0",
    "certifi>=2024.0.0",
    "cffi>=1.17.0",
    "chardet>=5.2.0",
    "charset-normalizer>=3.4.0",
    "cryptography>=43.0.0",
    "davey>=0.1.6",
    "discord-py[voice]>=2.4.0",
    "distro>=1.9.0",
    "frozenlist>=1.5.0",
    "idna>=3.10",
    "multidict>=6.1.0",
    "mutagen>=1.47.0",
    "packaging>=24.0",
    "propcache>=0.2.0",
    "protobuf>=4.21.0",
    "psutil>=5.9.0",
    "pycparser>=2.22",
    "pycryptodomex>=3.20.0",
    "pygments>=2.18.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "typing-extensions>=4.12.0",
    "uptime>=3.0.1",
    "urllib3>=2.2.0",
    "websockets>=13.0",
    "yarl>=1.18.0",
    "yt-dlp>=2025.1.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cogs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
