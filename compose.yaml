services:
  batekbot:
    image: python:3.12-alpine
    container_name: batekbot
    volumes:
      - /srv/batekbot/code:/app
      - /srv/batekbot/venv:/app/venv
    working_dir: /app
    command: >
      sh -c "apk add --no-cache ffmpeg &&
             source /app/venv/bin/activate &&
             python main.py"
    mem_limit: 400m
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts-alpine
    container_name: jenkins
    ports:
      - "8080:8080"
    volumes:
      - /srv/jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 512m
    restart: unless-stopped



