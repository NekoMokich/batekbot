[package]
name = "batekbot"
version = "0.1.0"
edition = "2021"

[dependencies]
serenity = { version = "0.12.5", features = ["collector"] }
# Telegram в том же процессе. native-tls намеренно выключен: рантайм это
# Alpine/musl без OpenSSL, поэтому только rustls. macros даёт команды,
# ctrlc_handler не нужен (процессом управляет Discord), но фича безвредна.
teloxide = { version = "0.17", default-features = false, features = [
    "rustls",
    "macros",
    "ctrlc_handler",
] }
poise = { version = "0.7.1", features = ["collector"] }
songbird = "0.6.1"
# Songbird NEVER requests codecs from Symphonia on its own (see songbird docs,
# "Codec support"): without these features /play compiles but is silent.
symphonia = { version = "0.5.4", features = [
    "mp3",
    "ogg",
    "vorbis",
    "wav",
    "flac",
    "pcm",
    "aac",
    "isomp4",
] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "tls-rustls"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "time",
    "sync",
    "fs",
] }
dotenvy = "0.15"
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
sysinfo = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Символы не нужны в образе: бинарник и так запускается, а размер меньше.
strip = true
